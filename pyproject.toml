[project]
name = "nudge"
version = "0.1.0"
description = "Reach the right controls and finish desktop tasks with fewer precise clicks."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6>=6.8",
    "httpx>=0.27",
    "websockets>=13",
    "openwakeword>=0.6",
    "onnxruntime>=1.17",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pynput>=1.7.7; sys_platform == 'win32'",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
]

[project.scripts]
nudge = "nudge.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nudge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
