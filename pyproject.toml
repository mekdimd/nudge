[project]
name = "nudge"
version = "0.1.0"
description = "Reach the right controls and finish desktop tasks with fewer precise clicks."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6>=6.8",
    "httpx>=0.27",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pynput>=1.7.7; sys_platform == 'win32'",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
]

[project.scripts]
nudge = "nudge.__main__:main"

[project.optional-dependencies]
vision = [
    "einops>=0.8.2",
    "huggingface-hub>=1.33.0",
    "mss>=10.2.0",
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
    "rapidocr-onnxruntime>=1.4.4 ; sys_platform == 'win32'",
    "timm>=1.0.30",
    "transformers>=4.49",
    "ultralytics>=8.4.172",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nudge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
