name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
        python: ['3.12', '3.13']
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.28'
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run offline tests
        run: uv run --no-sync pytest -q
      - name: Build release packages
        run: |
          uv build
          uv export --locked --no-hashes --no-dev --no-emit-project -o dist/constraints.txt > /dev/null
      - name: Check installed wheel and source distribution
        run: |
          for package in dist/*.whl dist/*.tar.gz; do
            uv venv --clear .package-check
            uv pip install --python .package-check -c dist/constraints.txt "$package"
            uv run --no-project --python .package-check python scripts/check_install.py
          done
      - name: Write package checksums
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(path for path in Path('dist').iterdir()
                         if path.name.endswith(('.whl', '.tar.gz')) or path.name == 'constraints.txt')
          Path('dist/SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n'
              for path in files
          ))
          PY
      - name: Upload checked packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  gate:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    if: ${{ always() }}
    steps:
      - name: Require all matrix jobs to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
