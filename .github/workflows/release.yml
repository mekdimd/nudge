name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.28'
          python-version: '3.13'
          enable-cache: false
      - name: Require a matching package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project python scripts/check_release.py "$RELEASE_TAG"
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main

  checks:
    name: Test and build
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download checked packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-macos-15-3.12
          path: dist/
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create release with checked packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Nudge $RELEASE_TAG"
